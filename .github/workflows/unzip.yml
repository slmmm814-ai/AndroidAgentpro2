name: Unzip AndroidAgentPro

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir extracted
          unzip -o AndroidAgentPro-autonomy-v3.zip -d extracted

          shopt -s dotglob
          items=(extracted/*)

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -a "${items[0]}"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f AndroidAgentPro-autonomy-v3.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract AndroidAgentPro autonomy v3"
          git push
